services:
  app:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-btcfoxman}/${IMAGE_NAME:-any-auto-register}:${IMAGE_TAG:-latest}
    build: .
    ports:
      - "8000:8000"   # FastAPI / Web UI
      - "6080:6080"   # noVNC (headed 浏览器预览)
      - "8889:8889"   # Turnstile Solver
    environment:
      - DISPLAY=:99
      - ACCOUNT_MANAGER_DATABASE_URL=sqlite:////app/data/account_manager.db
      - MAIL_CENTER_API_URL=${MAIL_CENTER_API_URL:-}
      - MAIL_CENTER_INTEGRATION_TOKEN=${MAIL_CENTER_INTEGRATION_TOKEN:-}
      - MAIL_CENTER_DOMAIN_STRATEGY=${MAIL_CENTER_DOMAIN_STRATEGY:-least_used}
      - MAIL_CENTER_DOMAIN=${MAIL_CENTER_DOMAIN:-}
      - MAIL_CENTER_PREFIX=${MAIL_CENTER_PREFIX:-}
      - MAIL_CENTER_PROVIDER_DEFAULT=${MAIL_CENTER_PROVIDER_DEFAULT:-true}
      # 可选：设置访问密码，不设置则无密码保护
      # - APP_PASSWORD=changeme
      # 可选：设置 VNC 密码
      # - VNC_PASSWORD=changeme
    volumes:
      - ./data:/app/data   # 持久化 SQLite 数据库
    restart: unless-stopped
