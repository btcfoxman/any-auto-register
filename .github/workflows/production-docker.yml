name: Production Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy instead of the newly built sha tag"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest
    environment: SSH-GCP
    outputs:
      image_tag: ${{ steps.tags.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract application version
        id: version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          data = Path("main.py").read_text(encoding="utf-8")
          match = re.search(r"FastAPI\([^)]*version\s*=\s*[\"']([^\"']+)[\"']", data, re.S)
          if not match:
              raise SystemExit("version not found in main.py")

          version = match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"version={version}")
          PY

      - name: Build tag list
        id: tags
        run: |
          set -euo pipefail
          IMAGE_BASE="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}"
          VERSION_TAG="v${{ steps.version.outputs.version }}"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          {
            echo "image_tag=${SHA_TAG}"
            echo "version_tag=${VERSION_TAG}"
            echo "value<<EOF"
            echo "${IMAGE_BASE}:${VERSION_TAG}"
            echo "${IMAGE_BASE}:${SHA_TAG}"
            echo "${IMAGE_BASE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.tags.outputs.version_tag }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  deploy:
    name: Deploy to Google Cloud VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: SSH-GCP
    steps:
      - name: Validate SSH deploy configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "::error::DEPLOY_HOST secret is required"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::DEPLOY_USER secret is required"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is required"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH secret is required"; exit 1; }

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAMESPACE: ${{ env.IMAGE_NAMESPACE }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-and-push.outputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          timeout: 60s
          command_timeout: 20m
          envs: DEPLOY_PATH,DEPLOY_SERVICE,GHCR_USERNAME,GHCR_TOKEN,IMAGE_REGISTRY,IMAGE_NAMESPACE,IMAGE_NAME,IMAGE_TAG
          script: |
            set -e
            test -n "$DEPLOY_PATH" || { echo "DEPLOY_PATH is required"; exit 1; }
            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login "$IMAGE_REGISTRY" -u "$GHCR_USERNAME" --password-stdin

            SERVICE="${DEPLOY_SERVICE:-app}"
            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            IMAGE_NAMESPACE="$IMAGE_NAMESPACE" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose pull "$SERVICE"

            IMAGE_REGISTRY="$IMAGE_REGISTRY" \
            IMAGE_NAMESPACE="$IMAGE_NAMESPACE" \
            IMAGE_NAME="$IMAGE_NAME" \
            IMAGE_TAG="$IMAGE_TAG" \
              docker compose up -d "$SERVICE"
